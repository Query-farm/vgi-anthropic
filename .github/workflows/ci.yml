name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SQL test runner; must speak the same VGI protocol as the SDK.
  HAYBARN_VERSION: "2.0.1rc3"
  # pyproject carries no `[tool.uv.sources]`, so a fresh clone resolves from
  # PyPI. This pins that shut: if a local path source is ever added, CI still
  # proves the *published* dependencies are sufficient.
  UV_NO_SOURCES: "1"

jobs:
  check:
    name: Lint, offline tests, end-to-end SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --no-sources --all-extras
      - name: Ruff (lint)
        run: uv run --no-sources ruff check .
      - name: Ruff (format)
        run: uv run --no-sources ruff format --check .
      # Includes tests/test_end_to_end.py: a real ATTACH against a local fake of
      # the Admin API, so it needs no key and no network, and runs on every push.
      - name: Tests
        run: uv run --no-sources pytest -q
      - name: Entry points start without the dev checkouts
        run: |
          uv run --no-project anthropic_worker.py --help > /dev/null
          uv run --no-project serve.py --help > /dev/null

  # test/sql/*.test through DuckDB (the pinned haybarn-unittest + the signed
  # community `vgi` extension) over every transport, via ci/run-integration.sh --
  # the same script `make test-sql` runs. It serves the API from the local mock
  # (test/mock_api/server.py), so nothing here reaches the live API.
  integration:
    name: SQL tests (${{ matrix.os }}, ${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # launch: DuckDB starts the worker once on an AF_UNIX socket and pools it.
        transport: [stdio, launch, http]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build the worker
        run: uv sync --no-sources --all-extras
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          export WORKER="$PWD/ci/worker"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} PYTHON="uv run --no-project python" ci/run-integration.sh

  catalog:
    name: Catalog metadata (vgi-lint, structural)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --no-sources
      # Structural tier only. The behavioural tier executes every example
      # against a real organization and needs an Admin key — see live.yml.
      - name: vgi-lint (structural)
        run: >
          uvx --no-sources --from vgi-lint-check==2.9.0 vgi-lint lint "uv run --no-sources anthropic_worker.py"
          --no-execute --no-check-links --audit-waivers --fail-on warning
      # Every shipped example executed, and every expected_result compared,
      # against the local fake Admin API — no key, no network.
      - name: vgi-lint (behavioural, against the fake API)
        run: scripts/lint-behavioural.sh
